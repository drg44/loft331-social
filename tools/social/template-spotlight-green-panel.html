<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../loft331-brand.css">
<style>
  html,body{width:100vw;height:100vh;overflow:hidden;}
  body{display:flex;flex-direction:column;background:var(--color-green-600);position:relative;}
  /* photo top / solid green panel bottom — no gradient, site header-band aesthetic */
  .photo{flex:0 0 56vh;background-image:url('{{PHOTO}}');background-size:cover;background-position:center;position:relative;}
  /* black top gradient like the other templates so the logo pops */
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.4) 30%,rgba(0,0,0,0) 60%);}
  .logo{position:absolute;top:8vw;left:10vw;height:9.3vw;display:block;z-index:2;}
  /* headline + subtext + link centered together as one block in the panel */
  .panel{flex:1;padding:0 10vw;display:flex;flex-direction:column;justify-content:center;background:var(--color-green-600);}
  .headline{font-size:5.6vw;line-height:1.1;color:var(--color-white);max-width:80vw;}
  .subline{font-family:var(--font-sans);font-size:2.5vw;line-height:var(--leading-snug);color:var(--color-gray-200);margin-top:2.2vw;max-width:78vw;}
  .site{font-family:var(--font-sans);font-size:2.1vw;color:var(--color-white);opacity:0.92;letter-spacing:var(--tracking-wide);text-transform:uppercase;margin-top:4vw;}
</style>
</head>
<body>
  <div class="photo"></div>
  <img class="logo" src="data:image/png;base64,{{LOGO_B64}}" alt="Loft 331">
  <div class="panel">
    <div>
      <h1 class="headline">{{HEADLINE}}</h1>
      <div class="subline">{{SUBLINE}}</div>
    </div>
    <div class="site">loft331.ca</div>
  </div>
</body>
</html>
