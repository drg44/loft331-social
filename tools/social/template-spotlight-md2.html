<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../loft331-brand.css">
<style>
  /* Built to the Nov 3 2026 Drive brand guidelines §9: headline 8.1vw / lh 1.1 / soft shadow;
     subline 2.73vw, 0.55vw gap, 0.75vw optical inset, soft shadow; LOFT331.CA uppercase with shadow. */
  html,body{width:100vw;height:100vh;overflow:hidden;}
  body{position:relative;background:#111;}
  .photo{position:absolute;inset:0;background-image:url('{{PHOTO}}');background-size:{{PHOTO_SIZE}};background-position:{{PHOTO_POS}};}
  .overlay{position:absolute;inset:0;background:
    linear-gradient(to right,rgba(0,0,0,0.70) 0%,rgba(0,0,0,0.55) 40%,rgba(0,0,0,0.25) 70%,rgba(0,0,0,0.08) 100%),linear-gradient(to bottom,rgba(0,0,0,0.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,0.35) 100%);}
  .logo{position:absolute;top:7vh;left:10vw;height:9.3vw;display:block;}
  .content{position:absolute;left:10vw;right:8vw;top:50%;}
  .headline{white-space:nowrap;font-size:8.1vw;line-height:1.1;color:#fff;text-shadow:0 0.3vw 1.6vw rgba(0,0,0,0.45);}
  .subline{font-family:var(--font-sans);font-weight:400;font-size:2.73vw;line-height:var(--leading-snug);color:#fff;margin-top:0.55vw;padding-left:0.75vw;text-shadow:0 0.2vw 1vw rgba(0,0,0,0.5);}
  .site{position:absolute;left:10vw;bottom:7vh;line-height:1.2;font-family:var(--font-sans);font-size:2.1vw;color:#fff;letter-spacing:var(--tracking-wide);text-transform:uppercase;text-shadow:0 0.2vw 0.8vw rgba(0,0,0,0.5);}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="overlay"></div>
  <img class="logo" src="data:image/png;base64,{{LOGO_B64}}" alt="Loft 331">
  <div class="content">
    <h1 class="headline">{{HEADLINE}}</h1>
    <div class="subline">{{SUBLINE}}</div>
  </div>
  <div class="site">loft331.ca</div>
</body>
</html>
