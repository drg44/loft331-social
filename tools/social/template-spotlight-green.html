<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../loft331-brand.css">
<style>
  html,body{width:100vw;height:100vh;overflow:hidden;}
  body{position:relative;background:#111;}
  .photo{position:absolute;inset:0;background-image:url('{{PHOTO}}');background-size:cover;background-position:{{PHOTO_POS}};}
  .overlay{position:absolute;inset:0;background:
    linear-gradient(to bottom,rgba(1,60,63,0.95) 0%,rgba(1,60,63,0.86) 25%,rgba(1,60,63,0.82) 50%,rgba(1,60,63,0.88) 75%,rgba(1,60,63,0.96) 100%);}
  .logo{position:absolute;top:7vh;left:10vw;height:9.3vw;display:block;}
  .content{position:absolute;left:0;right:0;top:calc(7vh + 9.3vw);bottom:calc(7vh + 2.6vw);display:flex;flex-direction:column;justify-content:center;padding:0 10vw;}
  .headline{font-size:6.5vw;line-height:1.1;color:var(--color-white);max-width:80vw;}
  .subline{font-family:var(--font-sans);font-size:2.6vw;line-height:var(--leading-snug);color:var(--color-gray-200);margin-top:3.5vw;max-width:80vw;}
  .site{position:absolute;left:10vw;bottom:7vh;line-height:1.2;font-family:var(--font-sans);font-size:2.1vw;color:var(--color-white);opacity:0.92;letter-spacing:var(--tracking-wide);text-transform:uppercase;}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="overlay"></div>
  <img class="logo" src="data:image/png;base64,{{LOGO_B64}}" alt="Loft 331">
  <div class="content">
    <h1 class="headline">{{HEADLINE}}</h1>
    <div class="subline">{{SUBLINE}}</div>
  </div>
  <div class="site">loft331.ca</div>
</body>
</html>
