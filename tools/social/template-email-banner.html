<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../loft331-brand.css">
<style>
  html,body{width:100vw;height:100vh;overflow:hidden;}
  /* Mailchimp header banner (1200x600, rendered @2x for crispness).
     Editorial layout: shared left margin, logo top-aligned to it, event NAME as hero,
     one tight descriptor. Generous margins top + bottom. Nothing else. */
  :root{--m:5.5vw;}          /* single shared margin — logo + text share this left edge */
  body{position:relative;background:#111;}
  .photo{position:absolute;inset:0;background-image:url('{{PHOTO}}');background-size:cover;background-position:center;}
  .overlay{position:absolute;inset:0;background:
    linear-gradient(100deg,rgba(0,0,0,0.82) 0%,rgba(0,0,0,0.5) 42%,rgba(0,0,0,0.12) 72%,rgba(0,0,0,0.32) 100%),
    linear-gradient(to bottom,rgba(0,0,0,0.42) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 46%,rgba(0,0,0,0.72) 100%);}
  .logo{position:absolute;top:7vh;left:var(--m);height:15vh;display:block;}
  .content{position:absolute;left:var(--m);right:var(--m);bottom:11vh;max-width:64vw;}
  .eyebrow{font-family:var(--font-sans);font-size:1.4vw;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-green-muted);margin-bottom:1.6vh;}
  .headline{font-family:var(--font-display);font-weight:600;letter-spacing:-0.065em;font-size:8vw;line-height:0.92;color:#fff;margin:0;}
  .subline{font-family:var(--font-sans);font-size:1.9vw;line-height:1.4;color:#eef2f5;margin:2.4vh 0 0;max-width:52vw;}
  /* understated detail line — venue + site, not a button. Sits quietly under the copy. */
  .detail{font-family:var(--font-sans);font-size:1.3vw;letter-spacing:0.04em;color:#c9d4d2;margin-top:2.8vh;}
  .detail b{color:#fff;font-weight:600;}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="overlay"></div>
  <img class="logo" src="data:image/png;base64,{{LOGO_B64}}" alt="Loft 331">
  <div class="content">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="headline">{{HEADLINE}}</h1>
    <div class="subline">{{SUBLINE}}</div>
    <div class="detail">{{DETAIL}}</div>
  </div>
</body>
</html>
